<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                margin:0vw;
            }
            fieldset {
                background-color:rgb(255, 140, 140);
            }
            legend {
                font-weight:bold;
                font-size:2vw;
            }
            input:focus {
                transform:scale(1.05);
                transition:0.5s;
            }
            div.form {
                position:absolute;
                width:30vw;
                height:30vw;
                left: 35vw;
                top:3vw;
            } /*https://www.w3schools.com/css/css3_gradients.asp*/
            body {
                background-image: linear-gradient(to top, rgb(0,0,0), rgb(255,255,255));
            }
        </style>
    </head>
    <body>
        
        <div class="form">
            <form action="viewSignUps.html" id="clubform" method="post" onsubmit="confirms(this)" onreset="confirmr(this)">
                <fieldset>
                    <fieldset>
                        <legend>Standard Information</legend><br/>
                            <label> StudentId 
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="number" id="stid" name="stid" required>
                            </label> <br/><br/>
    
                            <label> Full Name
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="text" id="fname" name="fname" required>
                            </label> <br/><br/>
    
                            <label> Birthday
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="date" id="bday" name="bday" required>
                            </label> <br/><br/>
    
                            <label> Email
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="email" id="em" name="em" required>
                            </label><br/><br/>
                    </fieldset> <br/><br/>
    
                    <fieldset>
                        <legend>Additional Information</legend><br/>
                        <label> Phone Number
                            <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="text" id="mn" name="mn" required>
                        </label><br/><br/>
                        
                        <label> Grade Level
                            <select id="gl" required>
                                <option value="7">Grade 7</option>
                                <option value="8">Grade 8</option>
                                <option value="9">Grade 9</option>
                                <option value="10">Grade 10</option>
                                <option value="11">Grade 11</option>
                                <option value="12">Grade 12</option>
                            </select>
                        </label><br/><br/>
    
                        <label id="iore"> Intern or Extern? <br/>
                            <input m="Intern" type="radio" id="i" name="status" required>
                            <label for="i">Intern</label>
                            <input m="Extern" type="radio" id="e" name="status" required>
                            <label for="e">Extern</label>
                        </label><br/><br/>
    
                        <label> Preferred Organization
                            <select id="po" required>
                                <option value="Alianti">Alianti</option>
                                <option value="ACTS">ACTS</option>
                                <option value="Celluloid">Celluloid</option>
                                <option value="Math Club">Math Club</option>
                                <option value="Likha">Likha</option>
                                <option value="Himig Agham">Himig Agham</option>
                            </select>
                        </label><br/><br/>
                    </fieldset>
                    <br/>
                    <label> Why do you want to join?<br/>
                        <textarea onblur="functionblur(this)" onfocus="functionfocus(this)" type="textarea" required></textarea>
                    </label><br/><br/>
    
                    <input value="Submit Details" type="submit">
                    <input value="Clear Form" type="reset">
                    <a href="viewSignUps.html"><input type="button" value="View Sign Ups"></input></a>
                </fieldset>
            </form>
        </div>
        <script>
            function confirmr(cf) {
                    
            }
            function confirms(cf) {
                confirm("Are you sure you want to submit the form?");
            }
            function functionfocus(box) {
                box.style.backgroundColor="rgb(142, 198, 255)";
                box.style.transition="0.5s";
                box.transform="scale(1.05)";
            }
            function functionblur(box) {
                box.style.backgroundColor="rgb(200,200,200)";
                box.style.transition="0.5s";
            }

            //form js
            const HOLDER = 'info'
            function loadInfo() {
                const raw = localStorage.getItem(HOLDER);
                return raw ? JSON.parse(raw) : [];
            }

            function saveInfo(info) {
                localStorage.setItem(HOLDER, JSON.stringify(info));
            }
            const form = document.getElementById("clubform");
            form.onsubmit = i => {
                i.preventDefault();
                const studentId = document.getElementById("stid").value;
                const studentName = document.getElementById("fname").value;
                const studentBirthday = document.getElementById("bday").value;
                const mail = document.getElementById("em").value;
                const PhoneNumber = document.getElementById("mn").value;
                const GradeLevel = document.getElementById("gl").value;
                const Intern = document.getElementById("i").value;
                const Extern = document.getElementById("e").value;
                const PrefOrg = document.getElementById("po").value;

                const obj = {
                    id: Date.now(),
                    studentId,
                    studentName,
                    studentBirthday,
                    mail,
                    PhoneNumber,
                    GradeLevel,
                    Intern,
                    Extern,
                    PrefOrg
                }

                const info = loadInfo();
                info.push(obj);
                saveInfo(info);
                form.reset();
                console.log(info);
            }
        </script>
    </body>
</html>
