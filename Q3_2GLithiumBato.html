<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                margin:0vw;
            }
            fieldset {
                background-color:rgb(255, 140, 140);
            }
            legend {
                font-weight:bold;
                font-size:2vw;
            }
            input:focus {
                transform:scale(1.05);
                transition:0.5s;
            }
            div.form {
                position:absolute;
                width:30vw;
                height:30vw;
                left: 35vw;
                top:3vw;
            } /*https://www.w3schools.com/css/css3_gradients.asp*/
            body {
                background-image: linear-gradient(to top, rgb(0,0,0), rgb(255,255,255));
            }
        </style>
    </head>
    <body>
        
        <div class="form">
            <form action="viewSignUps.html" id="clubform" method="post" onsubmit="confirms(this)" onreset="confirmr(this)">
                <fieldset>
                    <fieldset>
                        <legend>Standard Information</legend><br/>
                            <label> StudentId 
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="number" id="stid" name="stid" required>
                            </label> <br/><br/>
    
                            <label> Full Name
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="text" id="fname" name="fname" required>
                            </label> <br/><br/>
    
                            <label> Birthday
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="date" id="bday" name="bday" required>
                            </label> <br/><br/>
    
                            <label> Email
                                <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="email" id="em" name="em" required>
                            </label><br/><br/>
                    </fieldset> <br/><br/>
    
                    <fieldset>
                        <legend>Additional Information</legend><br/>
                        <label> Phone Number
                            <input onblur="functionblur(this)" onfocus="functionfocus(this)" type="text" id="mn" name="mn" required>
                        </label><br/><br/>
                        
                        <label> Grade Level
                            <select id="gl" required>
                                <option value="7">Grade 7</option>
                                <option value="8">Grade 8</option>
                                <option value="9">Grade 9</option>
                                <option value="10">Grade 10</option>
                                <option value="11">Grade 11</option>
                                <option value="12">Grade 12</option>
                            </select>
                        </label><br/><br/>
    
                        <label id="iore"> Intern or Extern? <br/>
                            <input m="Intern" type="radio" id="i" name="status" required>
                            <label for="i">Intern</label>
                            <input m="Extern" type="radio" id="e" name="status" required>
                            <label for="e">Extern</label>
                        </label><br/><br/>
    
                        <label> Preferred Organization
                            <select id="po" required>
                                <option value="Alianti">Alianti</option>
                                <option value="ACTS">ACTS</option>
                                <option value="Celluloid">Celluloid</option>
                                <option value="Math Club">Math Club</option>
                                <option value="Likha">Likha</option>
                                <option value="Himig Agham">Himig Agham</option>
                            </select>
                        </label><br/><br/>
                    </fieldset>
                    <br/>
                    <label> Why do you want to join?<br/>
                        <textarea onblur="functionblur(this)" onfocus="functionfocus(this)" type="textarea" required></textarea>
                    </label><br/><br/>
    
                    <input value="Submit Details" type="submit">
                    <input value="Clear Form" type="reset">
                    <a href="viewSignUps.html"><input type="button" value="View Sign Ups"></input></a>
                </fieldset>
            </form>
        </div>
        <script>
            function confirmr(cf) {
                    
            }
            function confirms(cf) {
                confirm("Are you sure you want to submit the form?");
            }
            function functionfocus(box) {
                box.style.backgroundColor="rgb(142, 198, 255)";
                box.style.transition="0.5s";
                box.transform="scale(1.05)";
            }
            function functionblur(box) {
                box.style.backgroundColor="rgb(200,200,200)";
                box.style.transition="0.5s";
            }

            //form js
            const HOLDER = 'info'
            function loadInfo() {
                const raw = localStorage.getItem(HOLDER);
                return raw ? JSON.parse(raw) : [];
            }

            function saveInfo(info) {
                localStorage.setItem(HOLDER, JSON.stringify(info));
            }
            const form = document.getElementById("clubform");
            form.onsubmit = i => {
                i.preventDefault();
                const studentId = document.getElementById("stid").value;
                const studentName = document.getElementById("fname").value;
                const studentBirthday = document.getElementById("bday").value;
                const mail = document.getElementById("em").value;
                const PhoneNumber = document.getElementById("mn").value;
                const GradeLevel = document.getElementById("gl").value;
                const Intern = document.getElementById("i").value;
                const Extern = document.getElementById("e").value;
                const PrefOrg = document.getElementById("po").value;

                const obj = {
                    id: Date.now(),
                    studentId,
                    studentName,
                    studentBirthday,
                    mail,
                    PhoneNumber,
                    GradeLevel,
                    Intern,
                    Extern,
                    PrefOrg
                }

                const info = loadInfo();
                info.push(obj);
                saveInfo(info);
                form.reset();
                console.log(info);
            }
        /* References:
        Tonga. (2013, February 4). passing form data to another HTML page. Stack Overflow. https://stackoverflow.com/questions/14693758/passing-form-data-to-another-html-page
        W3Schools.com. (n.d.-aa). https://www.w3schools.com/jsref/event_preventdefault.asp
        W3Schools.com. (n.d.-ab). https://www.w3schools.com/css/css3_gradients.asp
        W3Schools.com. (n.d.-ac). https://www.w3schools.com/js/js_json_parse.asp
        W3Schools.com. (n.d.-ad). https://www.w3schools.com/jsref/prop_win_localstorage.asp 
        W3Schools. (n.d.). HTML <input type="radio">. Retrieved from w3schools.com: https://www.w3schools.com/tags/att_input_type_radio.asp
        W3Schools. (n.d.). HTML <input type="checkbox">. Retrieved from w3schools.com: https://www.w3schools.com/tags/att_input_type_checkbox.asp
        W3Schools. (n.d.). HTML <input> Tag. Retrieved from w3schools.com: https://www.w3schools.com/tags/tag_input.asp
        W3Schools. (n.d.). HTML <select> Tag. Retrieved from w3schools.com: https://www.w3schools.com/tags/tag_select.asp
        Arushi. (2018, January 23). Why do we use the novalidate attribute in HTML? Retrieved from tutorialspoint.com: https://www.tutorialspoint.com/Why-do-we-use-the-novalidate-attribute-in-HTML#:~:text=The%20novalidate%20attribute%20in%20HTML%20is%20used%20to%20signify%20that,continue%20%26%20submit%20the%20form%20later.
        MDN Contributors. (2021, February 20). <input type="button">. Retrieved from MDN Web Docs: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/button
        MDN Contributors. (2021, February 20). <input type="submit">. Retrieved from MDN Web Docs: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/submit
        W3Schools. (n.d.). HTML <input type="button">. Retrieved from w3schools.com: https://www.w3schools.com/tags/att_input_type_button.asp
        W3Schools. (n.d.). HTML Form Attributes. Retrieved from w3schools.com: https://www.w3schools.com/html/html_forms_attributes.asp
        W3Schools. (n.d.). HTML Form Elements. Retrieved from w3schools.com: https://www.w3schools.com/html/html_form_elements.asp
        W3Schools. (n.d.). HTML Forms. Retrieved from w3schoools.com: https://www.w3schools.com/html/html_forms.asp
        W3Schools. (n.d.). HTML Input Types. Retrieved from w3schools.com: https://www.w3schools.com/html/html_form_input_types.asp
        W3Schools. (n.d.). HTML <input type="reset">. Retrieved from w3schools.com: https://www.w3schools.com/tags/att_input_type_reset.asp
        ManasChhabra2. (2019, April 22). HTML| action Attribute. Retrieved from geeksforgeeks.org: https://www.geeksforgeeks.org/html-action-attribute/#:~:text=The%20HTML%20%7C%20action%20Attribute%20is,in%20the%20element.&text=Attribute%20Values%3A,the%20submission%20of%20the%20form
        W3Schools. (n.d.). HTML <form> action Attribute. Retrieved from w3schools.com: https://www.w3schools.com/tags/att_form_action.asp
        W3Schools. (n.d.). HTML <fieldset> Tag. Retrieved from w3schools.com: https://www.w3schools.com/tags/tag_fieldset.asp
        MDN Contributors. (2021, February 20). <fieldset>: The Field Set element. Retrieved from MDN Web Docs: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/fieldset
        W3Schools. (n.d.). HTML <legend> Tag. Retrieved from w3schools.com: https://www.w3schools.com/tags/tag_legend.asp */
        </script>
        
    </body>
</html>
