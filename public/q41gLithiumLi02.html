<!DOCTYPE html>
<html>
    <head>
        <style>
            .clicked {
                color:orange;
            }
            .unclicked {
                color:black;
            }
            div#movieform {
                position:absolute;
                border-radius:0.5vw;
                box-shadow: 0vw 0vw 0.7vw rgb(111, 111, 111);
                background-color:rgb(255, 255, 255);
                display:block;
                align-items:center;
                justify-content: center;
                width:34vw;
                top:5vw;
                padding-top:0.5vw;
                padding-bottom:2vw;
                left:33vw;
            }
            #title, #movieyear, #genre, #submitmovie {
                width:30vw;
                margin-bottom:1vw;
                height:2vw;
                border-radius:0.2vw;
                margin-left:1.7vw;
            }
            #submitmovie {
                height:2.5vw;
                font-family:Arial, Helvetica, sans-serif;
                font-weight:bold;
                background-color:rgb(64, 124, 255);
                color:white;
            }
            span.star {
                margin-top:0.2vw;
                position:relative;
                margin-bottom:2vw;
                width:1vw;
                height:1vw;
                display:inline-block;
                font-size:1.5vw;
                left:1.7vw;
            }
            #lablet, #labelmy, #labelg, #ratinglabel {
                font-family:Arial, Helvetica, sans-serif;
                font-weight:bold;
                margin-left:1.7vw;
            }
            #formtitle {
                font-weight:bold;
                font-family:Arial, Helvetica, sans-serif;
                text-align: center;
                font-size:2vw;
            }
            #movielisttitle {
                font-weight:bold;
                text-align:center;
                font-size:1.5vw;
                display:block;
                font-family:Arial, Helvetica, sans-serif;
            }
            #movierating {
                display:block;
                margin:auto;
            }
            li {
                margin-bottom: 0.5vw; 
                margin-left:-1.2vw; 
                background-color:rgb(245, 245, 245); 
                list-style-type: none; 
                border-style:solid; 
                border-width:0.1vw; 
                padding-top:0.7vw;
                padding-bottom:0.7vw;
                width:32vw;
            }
        </style>
    </head>
    <body>
        <div id="movieform">
            <div>
                <form id="movierating">
                    <p id="formtitle">Add a Movie</p> 
                    <label id="lablet">Title:</label></br>
                    <input type="text" required id="title"></br>
                    <label id="labelmy">Year:</label></br>
                    <input type="number" required id="movieyear"></br>
                    <label id="labelg">Genre:</label></br>
                    <select id="genre" required>
                        <option value="Action">Action</option>
                        <option value="Horror">Horror</option>
                        <option value="Romance">Romance</option>
                        <option value="Sci-fi">Sci-Fi</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedy">Comedy</option>
                    </select></br>
                    
                    <label id="ratinglabel">Rating:</label> </br>
                    <span class="star" id="star1" onclick="starrating(1)">★</span>
                    <span class="star" id="star2" onclick="starrating(2)">★</span>
                    <span class="star" id="star3" onclick="starrating(3)">★</span>
                    <span class="star" id="star4" onclick="starrating(4)">★</span>
                    <span class="star" id="star5" onclick="starrating(5)">★</span>
                </br>
                    <input id="submitmovie" type="submit" value="Add Movie">
                </form>
            </div>
            <div id="listofmovies">
                <p id="movielisttitle">Movie List</p>
                <ul id="movielist"></ul>
            </div>
        </div>
            <script>
                const KEYNOTE = 'array';
                const RATENOTE = 'rating';
                function savestarrating(n) {
                    localStorage.setItem(RATENOTE, JSON.stringify(n))
                }
                function getstarrating() {
                    return Number(localStorage.getItem(RATENOTE));
                }
                function starrating(n) {
                    if (!n) {
                        n=0;
                    }
                    if (n===0) {
                        document.getElementById("star1").classList.add("unclicked");
                        document.getElementById("star2").classList.add("unclicked");
                        document.getElementById("star3").classList.add("unclicked");
                        document.getElementById("star4").classList.add("unclicked");
                        document.getElementById("star5").classList.add("unclicked");

                        document.getElementById("star1").classList.remove("clicked");
                        document.getElementById("star2").classList.remove("clicked");
                        document.getElementById("star3").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");

                        savestarrating(n);
                    }
                    if (n===1) {
                        document.getElementById("star1").classList.add("clicked");
                        document.getElementById("star2").classList.add("unclicked");
                        document.getElementById("star3").classList.add("unclicked");
                        document.getElementById("star4").classList.add("unclicked");
                        document.getElementById("star5").classList.add("unclicked");

                        document.getElementById("star1").classList.remove("unclicked");
                        document.getElementById("star2").classList.remove("clicked");
                        document.getElementById("star3").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");

                        savestarrating(n);
                    }
                    if (n===2) {
                        document.getElementById("star1").classList.add("clicked");
                        document.getElementById("star2").classList.add("clicked");
                        document.getElementById("star3").classList.add("unclicked");
                        document.getElementById("star4").classList.add("unclicked");
                        document.getElementById("star5").classList.add("unclicked");

                        document.getElementById("star1").classList.remove("unclicked");
                        document.getElementById("star2").classList.remove("unclicked");
                        document.getElementById("star3").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");

                        savestarrating(n);
                    }
                    if (n===3) {
                        document.getElementById("star1").classList.add("clicked");
                        document.getElementById("star2").classList.add("clicked");
                        document.getElementById("star3").classList.add("clicked");
                        document.getElementById("star4").classList.add("unclicked");
                        document.getElementById("star5").classList.add("unclicked");

                        document.getElementById("star1").classList.remove("unclicked");
                        document.getElementById("star2").classList.remove("unclicked");
                        document.getElementById("star3").classList.remove("unclicked");
                        document.getElementById("star4").classList.remove("clicked");
                        document.getElementById("star4").classList.remove("clicked");
                        
                        savestarrating(n);
                    }
                    if (n===4) {
                        document.getElementById("star1").classList.add("clicked");
                        document.getElementById("star2").classList.add("clicked");
                        document.getElementById("star3").classList.add("clicked");
                        document.getElementById("star4").classList.add("clicked");
                        document.getElementById("star5").classList.add("unclicked");

                        document.getElementById("star1").classList.remove("unclicked");
                        document.getElementById("star2").classList.remove("unclicked");
                        document.getElementById("star3").classList.remove("unclicked");
                        document.getElementById("star4").classList.remove("unclicked");
                        document.getElementById("star5").classList.remove("clicked");

                        savestarrating(n);
                    }
                    if (n===5) {
                        document.getElementById("star1").classList.add("clicked");
                        document.getElementById("star2").classList.add("clicked");
                        document.getElementById("star3").classList.add("clicked");
                        document.getElementById("star4").classList.add("clicked");
                        document.getElementById("star5").classList.add("clicked");

                        document.getElementById("star1").classList.remove("unclicked");
                        document.getElementById("star2").classList.remove("unclicked");
                        document.getElementById("star3").classList.remove("unclicked");
                        document.getElementById("star4").classList.remove("unclicked");
                        document.getElementById("star5").classList.remove("unclicked");

                        savestarrating(n);
                    }
                }
                
                function saverating(rating) {
                    localStorage.setItem(KEYNOTE, JSON.stringify(rating));
                }
                function getrating() {
                    const value = localStorage.getItem(KEYNOTE);
                    return value ? JSON.parse(value) : [];
                }
                const form = document.getElementById("movierating");
                form.onsubmit = i => {
                    i.preventDefault();
                    const mtitle = document.getElementById("title").value;
                    const myear = document.getElementById("movieyear").value;
                    const mgenre = document.getElementById("genre").value;
                    const starrate = getstarrating();
                    let staramount;
                    const movielist = document.getElementById("movielist");
                    let movietext = "";
                    const movies = getrating();
                    const obj = {
                        id: Date.now(),
                        mtitle,
                        myear,
                        mgenre,
                        starrate
                    }
                    movies.push(obj);
                    for (let i = 0; i < movies.length; i++) {
                        if (movies[i].starrate==0) {
                            staramount = "";
                        }
                        else if (movies[i].starrate==1) {
                            staramount = "★";
                        }
                        else if (movies[i].starrate==2) {
                            staramount = "★★";
                        }
                        else if (movies[i].starrate==3) {
                            staramount = "★★★";
                        }
                        else if (movies[i].starrate==4) {
                            staramount = "★★★★";
                        }
                        else if (movies[i].starrate==5) {
                            staramount = "★★★★★";
                        }
                        movietext = movietext + `<li> ${movies[i].mtitle} (${movies[i].myear}) - ${movies[i].mgenre}, Rating: <span style="color:gold">${staramount}`;
                    }
                    staramount="";
                    saverating(movies);
                    movielist.innerHTML=movietext;
                    movietext="";
                    form.reset();
                }
                /*
                W3Schools. (n.d.). HTML <input type="radio">. Retrieved from w3schools.com: https://www.w3schools.com/tags/att_input_type_radio.asp

                MikeSwanson. (2011, May 8). How can I make my DIVs appear below each other. Stack Overflow. https://stackoverflow.com/questions/5925741/how-can-i-make-my-divs-appear-below-each-other

            */
            </script>
        </div>
    </body>
</html>
